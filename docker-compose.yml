services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: opspilot, POSTGRES_PASSWORD: opspilot, POSTGRES_DB: opspilot}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U opspilot"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379/0
      OPSPILOT_REASONER: ${OPSPILOT_REASONER:-rules}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPSPILOT_LLM_MODEL: ${OPSPILOT_LLM_MODEL:-gpt-4o-mini}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
